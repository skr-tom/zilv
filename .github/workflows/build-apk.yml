name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Locate project and show structure
        run: |
          echo "== 仓库根目录 =="
          ls -la
          echo "== 查找 Gradle 工程 =="
          SETTINGS=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "没有找到 settings.gradle(.kts)，请检查文件结构："
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "工程目录: $DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zili-apk
          path: "**/build/outputs/apk/debug/*.apk"
